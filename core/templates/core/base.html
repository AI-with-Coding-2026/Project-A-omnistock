<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OmniStock{% endblock %}</title>
    <style>

        :root {
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-muted: #e2e8f0;
            --border-accent: #cbd5e1;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --shadow-card: 0 4px 12px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
            --radius-card: 12px;
            --radius-btn: 8px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.5;
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Typography & Global Links */
        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Flash Messages */
        .messages {
            margin-bottom: 1.5rem;
        }
        .message {
            padding: 0.875rem 1.25rem;
            border-radius: var(--radius-btn);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        .error { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        /* Modern Cards (Dashboard & Content Panels) */
        .card, .content-box {
            background: var(--bg-card);
            border: 1px solid var(--border-muted);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .dashboard-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .metric-card {
            background: #f8fafc;
            border: 1px solid var(--border-muted);
            border-radius: var(--radius-btn);
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            color: var(--text-main);
        }

        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            margin-top: 1rem;
            margin-bottom: 0.375rem;
        }

        form input, form select, form textarea {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border-muted);
            border-radius: var(--radius-btn);
            font-size: 0.875rem;
            color: var(--text-main);
            background-color: #ffffff;
            box-sizing: border-box;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        form input:focus, form select:focus, form textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button, .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.625rem 1.25rem;
            border: 1px solid transparent;
            border-radius: var(--radius-btn);
            cursor: pointer;
            margin-top: 1.25rem;
            transition: background-color 0.15s ease;
            text-decoration: none;
        }

        button:hover, .btn:hover {
            background-color: var(--primary-hover);
            text-decoration: none;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-muted) !important;
            margin-top: 1rem;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-muted);
        }

        td {
            padding: 1rem;
            font-size: 0.875rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-muted);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="container">
        {% if messages %}
            <div class="messages">
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
            </div>
        {% endif %}
        
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
